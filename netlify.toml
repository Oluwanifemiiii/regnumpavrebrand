[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 5 + sharp need a modern Node. Netlify defaults can lag behind.
  NODE_VERSION = "20"

# Single-page app fallback: every route is served by index.html so React
# Router can handle client-side paths (deep links, refreshes) without 404s.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
